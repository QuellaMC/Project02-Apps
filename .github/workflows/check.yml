name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: The catalog and its files agree
        run: node tools/check.mjs ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
